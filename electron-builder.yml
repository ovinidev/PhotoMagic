# Windows installer (DESIGN §11). `pnpm dist` builds with electron-vite first.
appId: com.fotomagica.desktop
productName: Foto Mágica
copyright: Copyright © Foto Mágica

directories:
  output: release
  buildResources: assets/brand

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true
# sharp loads native libvips binaries, which cannot run from inside the asar archive.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

win:
  target:
    - target: nsis
      arch: [x64]
  # The symbol on a light tile at 16, 32, 48 and 256 px, never the full logo (`pnpm icon` rebuilds it from icon.png).
  icon: assets/brand/icon.ico
  # Signing happens only when CSC_LINK and CSC_KEY_PASSWORD are set; otherwise the installer is unsigned.

nsis:
  # Per-user, one click: the client installs it himself with no admin prompt, and the silent update on
  # quit never asks for elevation either. Installs to %LOCALAPPDATA%\Programs\fotomagica. An assisted
  # (oneClick: false) installer would show the "all users" choice, which elevates.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Foto Mágica
  uninstallDisplayName: Foto Mágica
  installerIcon: assets/brand/icon.ico
  uninstallerIcon: assets/brand/icon.ico
  # An update downloaded in the background installs silently on quit (DESIGN §11); keep the user's data.
  deleteAppDataOnUninstall: false
  # Stable asset name: releases/latest/download/FotoMagica-Setup.exe
  artifactName: FotoMagica-Setup.${ext}

publish:
  provider: github
  owner: ovinidev
  repo: PhotoMagic
  releaseType: release
