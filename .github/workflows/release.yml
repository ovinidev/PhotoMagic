# Every push to main: the CI checks, then the Windows installer and a new GitHub Release (DESIGN §11, §12).
# The version comes from the latest v<x.y.z> tag plus one patch, or from package.json when a PR bumped it
# higher (scripts/release/next-version.mjs). It is stamped into package.json inside the job only; nothing is
# committed back to main, so this workflow never triggers itself. An existing tag or release is never touched.
# Code signing is optional: without CSC_LINK / CSC_KEY_PASSWORD the installer is unsigned and the job stays green.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time across the repository, never cancelled midway. If several merges queue up,
# GitHub keeps only the newest pending run; it contains every queued commit, so one release covers them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows:
    name: Windows installer
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute the release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags origin 'v*')"
          version="$(printf '%s\n' "$tags" | node scripts/release/next-version-cli.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Guard: never reuse an existing tag or release (e.g. a tag created by a race with another push).
          if printf '%s\n' "$tags" | grep -q "refs/tags/v$version\(\^{}\)\?$" \
            || gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::v$version already exists: building the installer as an artifact only."
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not on main ($GITHUB_REF): building the installer as an artifact only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version will be published."
          fi

      - name: Stamp the version into package.json (this job only, not committed)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -p "'package.json version: ' + require('./package.json').version"

      - name: Enable code signing when the secrets exist
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ] && [ -n "$CSC_KEY_PASSWORD_SECRET" ]; then
            delimiter="EOF_$(date +%s%N)"
            {
              echo "CSC_LINK<<$delimiter"; echo "$CSC_LINK_SECRET"; echo "$delimiter"
              echo "CSC_KEY_PASSWORD<<$delimiter"; echo "$CSC_KEY_PASSWORD_SECRET"; echo "$delimiter"
            } >> "$GITHUB_ENV"
            echo "Signing enabled."
          else
            echo "CSC_LINK / CSC_KEY_PASSWORD not set: the installer will be unsigned."
          fi

      - name: Build installer
        run: pnpm dist --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: FotoMagica-Setup-${{ steps.version.outputs.version }}
          path: |
            release/FotoMagica-Setup.exe
            release/FotoMagica-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh would attach a new release to an existing tag, so check again right before creating it.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION appeared during the build; not publishing over it."
            exit 1
          fi
          gh release create "v$VERSION" \
            release/FotoMagica-Setup.exe \
            release/FotoMagica-Setup.exe.blockmap \
            release/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Foto Mágica $VERSION" \
            --generate-notes
