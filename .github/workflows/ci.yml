# Checks contract (DESIGN §12): typecheck, oxlint, unit tests with coverage, Playwright on Electron.
# Pushes to main run these same checks through release.yml, before packaging.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:coverage

      # System libraries Chromium (and therefore Electron) needs on a bare Ubuntu runner.
      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E (simulated printer, no webcam)
        run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          FOTOMAGICA_E2E: '1'
          FOTOMAGICA_PRINTER: simulated

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
